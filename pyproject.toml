[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recipegen-graph-rag"
version = "0.3.0"
description = "Recipe graph retrieval, evidence-bound structured generation, and reproducible evaluation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "neo4j>=6.3.1,<7", "neo4j-graphrag==1.22.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
recipegen = "recipegen.__main__:main"

[tool.setuptools]
packages = ["recipegen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
